<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EV Charging Debug Console</title>
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div>
                <h1>🔍 EV Charging Debug Console</h1>
                <p>Real-time monitoring of Home Assistant entities and algorithm state</p>
            </div>
            <nav class="app-nav">
                <a href="./" class="active">🔍 Debug Console</a>
                <a href="config">⚡ Configuration</a>
                <a href="diagnostic">🔧 Diagnostics</a>
            </nav>
        </header>
        <!-- Keep your existing toolbar, grid-2 cards, and <script> below -->

        <div class="controls">
            <button onclick="refreshData()">🔄 Refresh Now</button>
            <div class="auto-refresh-toggle">
                <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()">
                <label for="autoRefresh">Auto Refresh</label>
            </div>
            <div class="refresh-interval">
                <label for="refreshInterval">Interval (s):</label>
                <input type="number" id="refreshInterval" min="1" max="60" value="5" onchange="updateRefreshInterval()">
            </div>
            <button class="secondary" onclick="copyToClipboard()">📋 Copy All</button>
        </div>

        <div class="grid">
            <!-- Entity Values Panel -->
            <div class="panel">
                <div class="panel-title">🏠 Home Assistant Entities</div>
                <div id="entitiesError" class="error-message" style="display: none;"></div>
                <div id="entitiesList" class="entity-list">
                    <div class="loading"><div class="spinner"></div> Loading...</div>
                </div>
                <div class="timestamp">Last updated: <span id="entitiesTimestamp">--:--:--</span></div>
            </div>

            <!-- Algorithm State Panel -->
            <div class="panel">
                <div class="panel-title">⚙️ Algorithm State</div>
                <div id="stateError" class="error-message" style="display: none;"></div>
                <div id="stateList" class="entity-list">
                    <div class="loading"><div class="spinner"></div> Loading...</div>
                </div>
                <div class="timestamp">Last updated: <span id="stateTimestamp">--:--:--</span></div>
            </div>
        </div>

        <!-- Raw JSON Panel -->
        <div class="panel">
            <div class="panel-title">📊 Raw JSON Data</div>
            <div id="jsonViewer" class="json-viewer">
                <pre id="jsonContent">Loading...</pre>
            </div>
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;
        let refreshIntervalMs = 5000;
        let entitiesData = null;
        let stateData = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            refreshData();
            if (document.getElementById('autoRefresh').checked) {
                startAutoRefresh();
            }
        });

        async function refreshData() {
            try {
                // Fetch entity values
                const entitiesResponse = await fetch('api/debug/entities');
                if (entitiesResponse.ok) {
                    const entitiesData = await entitiesResponse.json();
                    displayEntities(entitiesData);
                    document.getElementById('entitiesError').style.display = 'none';
                } else {
                    showError('entitiesError', `HTTP ${entitiesResponse.status}`);
                }

                // Fetch algorithm state
                const stateResponse = await fetch('api/debug/state');
                if (stateResponse.ok) {
                    const stateData = await stateResponse.json();
                    displayAlgorithmState(stateData);
                    document.getElementById('stateError').style.display = 'none';
                } else {
                    showError('stateError', `HTTP ${stateResponse.status}`);
                }

                // Store for JSON view
                window.lastData = { entities: entitiesData, state: stateData };
                updateJsonView();
            } catch (error) {
                console.error('Error fetching data:', error);
                showError('entitiesError', error.message);
                showError('stateError', error.message);
            }
        }

        function displayEntities(data) {
            const list = document.getElementById('entitiesList');
            list.innerHTML = '';

            const entities = data.entities || {};
            Object.entries(entities).forEach(([key, value]) => {
                const item = createEntityItem(key, value);
                list.appendChild(item);
            });

            document.getElementById('entitiesTimestamp').textContent = new Date(data.timestamp).toLocaleTimeString();
        }

        function displayAlgorithmState(state) {
            const list = document.getElementById('stateList');
            list.innerHTML = '';

            // Display key state values
            const keyValues = [
                ['Target Amps', state.targetAmps, 'A'],
                ['Ideal Max Amps', state.idealMaxAmps, 'A'],
                ['Available Watts', state.availableWatts, 'W'],
                ['Solar Grab Active', state.solarGrabActive ? '✓ Yes' : '✗ No', ''],
                ['Export Boost Active', state.exportBoostActive ? '✓ Yes' : '✗ No', ''],
                ['Stop Required', state.stopRequired ? '✓ Yes' : '✗ No', ''],
                ['Stop Countdown', state.stopCountdownRemaining, 's'],
                ['Last Command', state.lastCommand || 'None', ''],
                ['Last Set Amps', state.lastSetAmps ?? '--', 'A'],
                ['Status', state.statusText || 'N/A', '']
            ];

            keyValues.forEach(([key, value, unit]) => {
                const item = createEntityItem(key, `${value} ${unit}`.trim());
                list.appendChild(item);
            });

            document.getElementById('stateTimestamp').textContent = new Date().toLocaleTimeString();
        }

        function createEntityItem(label, value) {
            const item = document.createElement('div');
            item.className = 'entity-item';

            const labelEl = document.createElement('div');
            labelEl.className = 'entity-label';
            labelEl.textContent = label;

            const valueEl = document.createElement('div');
            valueEl.className = 'entity-value';

            // Determine value class based on content
            if (typeof value === 'boolean') {
                valueEl.textContent = value ? '✓ True' : '✗ False';
                valueEl.classList.add(value ? 'good' : 'warning');
            } else if (typeof value === 'number') {
                valueEl.textContent = value.toFixed(2);
                valueEl.classList.add(value > 0 ? 'good' : 'warning');
            } else if (typeof value === 'string') {
                valueEl.textContent = value;
                if (value.includes('Error') || value.includes('error')) {
                    valueEl.classList.add('error');
                } else if (value.includes('N/A') || value === 'None') {
                    valueEl.classList.add('warning');
                } else {
                    valueEl.classList.add('good');
                }
            } else {
                valueEl.textContent = JSON.stringify(value);
                valueEl.classList.add('info');
            }

            item.appendChild(labelEl);
            item.appendChild(valueEl);
            return item;
        }

        function showError(elementId, message) {
            const errorDiv = document.getElementById(elementId);
            errorDiv.textContent = `Error: ${message}`;
            errorDiv.style.display = 'block';
        }

        function updateJsonView() {
            const jsonContent = document.getElementById('jsonContent');
            if (window.lastData) {
                jsonContent.textContent = JSON.stringify(window.lastData, null, 2);
            }
        }

        function toggleAutoRefresh() {
            if (document.getElementById('autoRefresh').checked) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(refreshData, refreshIntervalMs);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
        }

        function updateRefreshInterval() {
            refreshIntervalMs = document.getElementById('refreshInterval').value * 1000;
            if (document.getElementById('autoRefresh').checked) {
                startAutoRefresh();
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('jsonContent').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Data copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }
    </script>
</body>
</html>
